<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - GoodMoodFood</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #fdfdfd;
      color: #333;
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    .item {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid #ddd;
      padding: 20px 0;
      align-items: center;
    }

    .item img {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
    }

    .info {
      flex: 1;
    }

    .price {
      font-weight: bold;
      font-size: 1rem;
      color: #ff6f61;
    }

    .total-section {
      text-align: right;
      margin-top: 30px;
      font-size: 1.2rem;
    }

    button {
      background-color: #ff6f61;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #e55447;
    }

    .note {
      font-size: 0.9rem;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Your Basket</h2>
  <div id="basketItems"></div>

  <div class="total-section">
    <p><strong>Total:</strong> £<span id="totalPrice">0.00</span></p>
    <button id="confirmBtn">Confirm & Checkout</button>
    <p class="note">* This is a simulated checkout. No real payment required.</p>
  </div>

  <script>
    const basket = JSON.parse(localStorage.getItem("basket") || "[]");
    const container = document.getElementById("basketItems");
    const totalPriceElement = document.getElementById("totalPrice");

    let total = 0;

    if (basket.length === 0) {
      container.innerHTML = "<p>Your basket is empty.</p>";
    } else {
      basket.forEach(meal => {
        const price = meal.price || Math.floor(Math.random() * 10) + 5;
        total += price;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <img src="${meal.image}" alt="${meal.name}" />
          <div class="info">
            <h4>${meal.name}</h4>
            <p>${meal.restaurant}</p>
            <p class="note">${meal.nutritionNote}</p>
          </div>
          <div class="price">£${price.toFixed(2)}</div>
        `;
        container.appendChild(div);
      });
    }

    totalPriceElement.textContent = total.toFixed(2);

    document.getElementById("confirmBtn").addEventListener("click", () => {
      alert("✅ Order placed! Thank you for using GoodMoodFood.");
      localStorage.removeItem("basket");
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
