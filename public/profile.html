<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - GoodMoodFood</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #ff6f61;
      margin-bottom: 10px;
    }

    .profile-image {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-image img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff6f61;
    }

    .profile-image input {
      margin-top: 10px;
    }

    .profile-info p {
      font-size: 1.05rem;
      margin: 10px 0;
    }

    .edit-form label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    .edit-form input,
    .edit-form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .edit-form button {
      margin-top: 20px;
      background-color: #ff6f61;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .edit-form button:hover {
      background-color: #e55447;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .actions a {
      background-color: #ff6f61;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .actions a:hover {
      background-color: #e55447;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
      margin-top: 40px;
    }

    .highlight {
      color: #ff6f61;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Your Profile</h1>
  </header>

  <div class="container">
    <h2>Hello, <span id="userName">Friend</span> </h2>

    <div class="profile-image">
      <img id="avatar" src="https://via.placeholder.com/120" alt="Profile Image">
      <input type="file" id="upload" accept="image/*">
    </div>

    <div class="profile-info">
      <p><strong>Email:</strong> <span id="emailInfo"></span></p>
      <p><strong>Joined:</strong> <span id="createdAt"></span></p>
      <p><strong>Preferences Completed:</strong> <span id="profileStatus"></span></p>
      <p><strong>Diet Type:</strong> <span id="dietType">–</span></p>
      <p><strong>Allergies:</strong> <span id="allergies">–</span></p>
      <p><strong>Intolerances:</strong> <span id="intolerances">–</span></p>
    </div>

    <form class="edit-form" id="editForm">
      <label for="displayName">Display Name</label>
      <input type="text" id="displayName" placeholder="Your name..." />

      <label for="goals">Bio / Wellness Goals</label>
      <textarea id="goals" rows="3" placeholder="e.g., I want to eat healthier, try more veggie meals..."></textarea>

      <button type="submit"> Save Changes</button>
    </form>

    <div class="actions">
      <a href="dashboard.html"> Dashboard</a>
      <a href="questionnaire.html"> Update Preferences</a>
      <a href="orders.html"> Recent Orders</a>
    </div>
  </div>

  <footer>
    &copy; 2024 GoodMoodFood. All rights reserved.
  </footer>

  <script type="module">
    import { app } from "../firebase-config.js";
    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

      // Get references to UI elements
    const userName = document.getElementById("userName");
    const emailInfo = document.getElementById("emailInfo");
    const createdAt = document.getElementById("createdAt");
    const profileStatus = document.getElementById("profileStatus");
    const dietType = document.getElementById("dietType");
    const allergies = document.getElementById("allergies");
    const intolerances = document.getElementById("intolerances");
    const avatar = document.getElementById("avatar");
    const upload = document.getElementById("upload");
    const displayNameInput = document.getElementById("displayName");
    const goalsInput = document.getElementById("goals");
    const editForm = document.getElementById("editForm");

    let currentUserId = null;
// Listen for authentication state changes
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // User is signed in

        currentUserId = user.uid;
        emailInfo.textContent = user.email;

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {

        // Populate profile info
          const data = userSnap.data();
          userName.textContent = data.displayName || user.email;
          displayNameInput.value = data.displayName || "";
          goalsInput.value = data.goals || "";
          createdAt.textContent = data.createdAt?.toDate().toLocaleDateString() || "Unknown";
          profileStatus.textContent = data.completedProfile ? " Yes" : " No";
          dietType.textContent = data.preferences?.dietType || "Not set";
          allergies.textContent = (data.preferences?.allergies || []).join(", ") || "None";
          intolerances.textContent = (data.preferences?.intolerance || []).join(", ") || "None";

          if (data.avatarUrl) {
            avatar.src = data.avatarUrl;
          }
        }
      } else {
        window.location.href = "login.html";
      }
    });
// Handle form submission to update display name and goals
    editForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUserId) return;

      const userRef = doc(db, "users", currentUserId);
      await updateDoc(userRef, {
        displayName: displayNameInput.value,
        goals: goalsInput.value
      });
      alert(" Profile updated successfully!");
    });

    upload.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file || !currentUserId) return;
// Upload the new avatar image to Firebase Storage
      const storageRef = ref(storage, `avatars/${currentUserId}`);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);

      avatar.src = url;
      const userRef = doc(db, "users", currentUserId);
      await updateDoc(userRef, { avatarUrl: url });
    });
  </script>
</body>
</html>
