<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - GoodMoodFood</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    /* Slideshow Background */
    .background-slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .background-slideshow .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.6);
      transition: opacity 1.5s ease-in-out;
    }

    .background-slideshow .slide.active {
      opacity: 1;
    }

    body {
      background: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0 20px;
    }

    .login-card {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-in-out;
      position: relative;
      z-index: 1;
    }

    .login-card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .login-card form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-card label {
      font-weight: 500;
      font-size: 0.95rem;
      color: #444;
    }

    .login-card input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .login-card input:focus {
      border-color: #ff6f61;
      outline: none;
    }

    .login-card input[type="submit"] {
      background-color: #ff6f61;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .login-card input[type="submit"]:hover {
      background-color: #e55447;
    }

    .alt-option {
      text-align: center;
      margin-top: 20px;
    }

    .alt-option a {
      color: #ff6f61;
      font-weight: 600;
      text-decoration: none;
    }

    .alt-option a:hover {
      text-decoration: underline;
    }

    #error-msg {
      color: red;
      text-align: center;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      color: #fff;
      padding: 15px 10px;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Slideshow Background -->
  <div class="background-slideshow">
    <img src="../images/baked-goods-1846460_1920.jpg" class="slide active">
  </div>

  <!-- Login Form -->
  <div class="login-card">
    <h2>Welcome Back</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required />

      <input type="submit" value="Login" />
    </form>

    <div id="error-msg"></div>

    <div class="alt-option">
      <p>Don't have an account? <a href="register.html">Register here</a></p>
      <p><a href="#" id="forgotPassword">Forgot your password?</a></p>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 GoodMoodFood. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTiLV8wLyZQc0W-YzdWQGooZq2KFoU00w",
      authDomain: "goodmoodfood-84f7b.firebaseapp.com",
      projectId: "goodmoodfood-84f7b",
      storageBucket: "goodmoodfood-84f7b.appspot.com",
      messagingSenderId: "715419127474",
      appId: "1:715419127474:web:6e86fbb1465bad30df83ab"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("error-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        if (!user.emailVerified) {
          errorMsg.textContent = "Please verify your email before logging in.";
          return;
        }

        const userDoc = await getDoc(doc(db, "users", user.uid));

        if (userDoc.exists()) {
          const data = userDoc.data();
          window.location.href = data.role === "restaurant" ? "restaurant-panel.html" :
                                 data.completedProfile ? "dashboard.html" : "questionnaire.html";
        } else {
          errorMsg.textContent = "User data not found.";
        }
      } catch (error) {
        switch (error.code) {
          case "auth/wrong-password":
            errorMsg.textContent = "Incorrect password. Please try again.";
            break;
          case "auth/user-not-found":
            errorMsg.textContent = "No account found for that email.";
            break;
          case "auth/too-many-requests":
            errorMsg.textContent = "Too many attempts. Please wait or reset your password.";
            break;
          default:
            errorMsg.textContent = "Login error: " + error.message;
        }
      }
    });
  </script>
  
</body>
</html>
