<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Food Preferences - GoodMoodFood</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body {
      background: linear-gradient(to right, #ff6f61, #ffa07a);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .questionnaire-card {
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-in-out;
    }

    .questionnaire-card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .questionnaire-card p {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 25px;
    }

    .form-section {
      margin-bottom: 25px;
    }

    .form-section label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #444;
    }

    .checkbox-group, .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .checkbox-group label,
    .radio-group label {
      background-color: #f5f5f5;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    select, input[type="submit"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      transition: border-color 0.3s ease;
    }

    select:focus {
      border-color: #ff6f61;
      outline: none;
    }

    input[type="submit"] {
      background-color: #ff6f61;
      color: #fff;
      font-weight: bold;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #e55447;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .questionnaire-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="questionnaire-card">
    <h2>Your Food Preferences</h2>
    <p>Let us know your tastes and dietary needs so we can recommend meals you'll love!</p>

    <form id="questionnaireForm">
      <!-- Allergies -->
      <div class="form-section">
        <label>Do you have any food allergies?</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="allergies" value="peanuts"> Peanuts</label>
          <label><input type="checkbox" name="allergies" value="dairy"> Dairy</label>
          <label><input type="checkbox" name="allergies" value="shellfish"> Shellfish</label>
          <label><input type="checkbox" name="allergies" value="none"> None</label>
        </div>
      </div>

      <!-- Intolerance -->
      <div class="form-section">
        <label>Any food intolerances?</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="intolerance" value="gluten"> Gluten</label>
          <label><input type="checkbox" name="intolerance" value="lactose"> Lactose</label>
          <label><input type="checkbox" name="intolerance" value="soy"> Soy</label>
          <label><input type="checkbox" name="intolerance" value="none"> None</label>
        </div>
      </div>

      <!-- Lifestyle -->
      <div class="form-section">
        <label>How would you describe your daily activity?</label>
        <select id="lifestyle">
          <option value="sedentary">Sedentary (mostly sitting)</option>
          <option value="moderate">Moderately active</option>
          <option value="active">Very active (gym/sports)</option>
          <option value="busy">Always on the move</option>
        </select>
      </div>

      <!-- Budget -->
      <div class="form-section">
        <label>Your typical meal budget:</label>
        <div class="radio-group">
          <label><input type="radio" name="budget" value="5"> Under £5</label>
          <label><input type="radio" name="budget" value="10"> £5–£10</label>
          <label><input type="radio" name="budget" value="15"> £10–£15</label>
          <label><input type="radio" name="budget" value="20+"> Over £15</label>
        </div>
      </div>

      <!-- Food Personality -->
      <div class="form-section">
        <label>Which best describes your food personality?</label>
        <select id="foodPersonality">
          <option value="adventurous">Adventurous – I like new things</option>
          <option value="comfort">Comfort food lover</option>
          <option value="healthy">Health-conscious</option>
          <option value="fastfood">Fast food fan</option>
          <option value="plantbased">Plant-based / Vegan</option>
        </select>
      </div>

      <input type="submit" value="Save My Preferences">
    </form>
  </div>

  <script type="module">
    import app from '../firebase-config.js';
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(app);
    const uid = localStorage.getItem("userUid");

    function getCheckedValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(cb => cb.value);
    }

    document.getElementById("questionnaireForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const allergies = getCheckedValues("allergies");
      const intolerance = getCheckedValues("intolerance");
      const lifestyle = document.getElementById("lifestyle").value;
      const budget = document.querySelector('input[name="budget"]:checked')?.value;
      const foodPersonality = document.getElementById("foodPersonality").value;

      try {
        await setDoc(doc(db, "users", uid), {
          preferences: {
            allergies,
            intolerance,
            lifestyle,
            budget,
            foodPersonality
          },
          completedProfile: true,
          createdAt: new Date()
        });

        alert("Preferences saved!");
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Error saving preferences: " + error.message);
      }
    });
  </script>
</body>
</html>
