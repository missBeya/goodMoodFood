<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Science-Based Meals</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #fdfdfd;
      margin: 0;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      background-color: #ff6f61;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e55447;
    }

    #status {
      margin-top: 20px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <h2>Add Science-Based Meals to Firestore</h2>
  <button id="addMealsBtn">Add Meals</button>
  <div id="status"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      getDocs,
      query,
      where,
      updateDoc,
      doc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyDTiLV8wLyZQc0W-YzdWQGooZq2KFoU00w",
      authDomain: "goodmoodfood-84f7b.firebaseapp.com",
      projectId: "goodmoodfood-84f7b",
      storageBucket: "goodmoodfood-84f7b.appspot.com",
      messagingSenderId: "715419127474",
      appId: "1:715419127474:web:6e86fbb1465bad30df83ab",
    };
  
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
  
    const tagMap = {
      "Risotto ai Funghi": ["umami", "savory", "vegetarian", "warm"],
      "Pasta Primavera": ["vegetarian", "light", "antioxidant-rich"],
      "Polenta with Grilled Vegetables": ["fiber-rich", "vegan", "grilled"],
      "Bruschetta Trio": ["starter", "herby", "low-calorie"],
      "Eggplant Parmigiana": ["comfort", "baked", "cheesy"],
      "Acqua Frizzante with Lemon": ["refreshing", "non-alcoholic", "low-calorie"],
      "Herbal Chamomile Tea": ["soothing", "non-caffeinated", "herbal"]
    };
  
    async function updateTags() {
      const mealsCol = collection(db, "meals");
  
      for (const [name, tags] of Object.entries(tagMap)) {
        const q = query(mealsCol, where("name", "==", name));
        const querySnapshot = await getDocs(q);
  
        if (!querySnapshot.empty) {
          querySnapshot.forEach(async (mealDoc) => {
            const mealRef = doc(db, "meals", mealDoc.id);
            await updateDoc(mealRef, { tags });
            console.log(`✅ Updated tags for ${name}`);
          });
        } else {
          console.log(`⚠️ Meal not found: ${name}`);
        }
      }
    }
  
    updateTags();
  </script>
  
</body>
</html>
