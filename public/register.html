<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - GoodMoodFood</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .background-slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .background-slideshow .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      filter: brightness(0.6);
      transition: opacity 1.5s ease-in-out;
    }

    .background-slideshow .slide.active {
      opacity: 1;
    }

    body {
      background: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0 20px;
    }

    .signup-card {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.6s ease-in-out;
      position: relative;
      z-index: 1;
    }

    .signup-card h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .signup-card form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .signup-card label {
      font-weight: 500;
      font-size: 0.95rem;
      color: #444;
    }

    .signup-card input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .signup-card input:focus {
      border-color: #ff6f61;
      outline: none;
    }

    .signup-card input[type="submit"] {
      background-color: #ff6f61;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .signup-card input[type="submit"]:hover {
      background-color: #e55447;
    }

    .alt-option {
      text-align: center;
      margin-top: 20px;
    }

    .alt-option a {
      color: #ff6f61;
      font-weight: 600;
      text-decoration: none;
    }

    .alt-option a:hover {
      text-decoration: underline;
    }

    #signup-msg {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      color: #fff;
      padding: 15px 10px;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="background-slideshow">
    <img src="../images/baked-goods-1846460_1920.jpg" class="slide active">
  </div>

  <!-- Sign Up Form -->
  <div class="signup-card">
    <h2>Create an Account</h2>
    <form id="signupForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Minimum 6 characters" required />

      <input type="submit" value="Continue" />
    </form>

    <div id="signup-msg"></div>

    <div class="alt-option">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 GoodMoodFood. All rights reserved.</p>
  </footer>

  <!-- Firebase Signup Logic -->
  <script type="module">
    import { auth, db } from '../firebase-config.js';
    import {
      createUserWithEmailAndPassword,
      sendEmailVerification
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const form = document.getElementById("signupForm");
    const message = document.getElementById("signup-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCred.user;

        await sendEmailVerification(user);
        message.style.color = "green";
        message.textContent = "Verification email sent. Check your inbox!";

        await setDoc(doc(db, "users", user.uid), {
          email: email,
          createdAt: new Date(),
          completedProfile: false
        });

        setTimeout(() => {
          window.location.href = "verify.html";
        }, 2000);
      } catch (err) {
        message.style.color = "red";
        message.textContent = "Signup error: " + err.message;
      }
    });
  </script>

</body>
</html>
